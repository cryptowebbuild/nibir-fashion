                  <p className="text-xs text-pink-100 leading-relaxed">
                    জিইসি সার্কেল / আফমি প্লাজা জোন, চট্টগ্রাম।
                  </p>
                </div>

              </div>

              {/* Contact Strip */}
              <div className="mt-10 p-6 rounded-2xl bg-royalRose-900/40 border border-royalRose-700/40 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-champagne-500/20 flex items-center justify-center text-champagne-400 font-bold">
                    📞
                  </div>
                  <div>
                    <p className="text-xs text-champagne-300 font-semibold">সেন্ট্রাল কাস্টমার সার্ভিস ও ব্রাইডাল বুকিং হটলাইন</p>
                    <p className="text-lg font-bold text-white">{BRAND_PHONE}</p>
                  </div>
                </div>

                <a 
                  href={`tel:${BRAND_PHONE}`}
                  className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-champagne-600 to-champagne-500 hover:brightness-110 text-royalRose-950 font-bold text-sm transition shadow-md"
                >
                  সরাসরি কথা বলুন
                </a>
              </div>

            </div>
          </section>

          {/* 6. FOOTER */}
          <footer className="mt-auto bg-royalRose-950 border-t border-royalRose-800/40 pt-12 pb-24 md:pb-12 text-xs sm:text-sm text-pink-200/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
              
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div className="space-y-3 md:col-span-2">
                  <div className="flex items-center gap-2">
                    <span className="font-serif font-bold text-lg text-white">NIBIR Fashion</span>
                    <span className="text-[10px] bg-royalRose-800 text-champagne-300 px-2 py-0.5 rounded border border-champagne-500/30">
                      ১.৭ মিলিয়ন ফলোয়ার্স
                    </span>
                  </div>
                  <p className="text-xs text-pink-200/70 max-w-md">
                    বনানী রোড ১১-এ অবস্থিত ৩ তলা বিশিষ্ট বাংলাদেশের প্রিমিয়াম ব্রাইডাল ও পার্টিওয়্যার ব্র্যান্ড।
                  </p>
                  <div className="flex items-center gap-3 pt-2">
                    <a href={FB_LINK} target="_blank" rel="noopener noreferrer" className="p-2 rounded bg-royalRose-900 border border-royalRose-700/40 hover:border-champagne-400 text-champagne-300">
                      ফেসবুক পেজ (১.৭M ফলোয়ার্স)
                    </a>
                  </div>
                </div>

                <div className="space-y-2">
                  <p className="font-bold text-white uppercase text-xs tracking-wider text-champagne-400">দ্রুত লিংক</p>
                  <ul className="space-y-1.5 text-xs">
                    <li><a href="#collection" className="hover:text-champagne-300">ব্রাইডাল কালেকশন</a></li>
                    <li><a href="#showrooms" className="hover:text-champagne-300">বনানী শোরুম ও আউটলেট</a></li>
                    <li><a href={`tel:${BRAND_PHONE}`} className="hover:text-champagne-300">হটলাইনে কল করুন</a></li>
                  </ul>
                </div>

                <div className="space-y-2">
                  <p className="font-bold text-white uppercase text-xs tracking-wider text-champagne-400">কনসেপ্ট ডেমো ক্রেডিট</p>
                  <p className="text-xs leading-relaxed text-pink-200/70">
                    এটি একটি প্রিমিয়াম মোবাইল ই-কমার্স কনসেপ্ট ডেমো। ডিজাইন ও ডেভেলপ করেছে <a href="https://cryptowebbuild.com" target="_blank" rel="noopener noreferrer" className="text-champagne-300 font-bold underline">CryptoWebBuild</a>।
                  </p>
                </div>
              </div>

              <div className="pt-6 border-t border-royalRose-800/40 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left text-xs">
                <p>© ২০২৬ NIBIR Fashion. সর্বস্বত্ব সংরক্ষিত।</p>
                <p className="text-champagne-400 font-medium">
                  Leading Bridal & Festive Ethnic Couture in Bangladesh
                </p>
              </div>

            </div>
          </footer>

          {/* 7. ORDER / WHATSAPP DRAWER MODAL */}
          {orderModalProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div 
                className="bg-royalRose-950 border border-champagne-500/60 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 relative text-pink-50"
                onClick={(e) => e.stopPropagation()}
              >
                
                {/* Close Button */}
                <button 
                  onClick={() => setOrderModalProduct(null)}
                  className="absolute top-4 right-4 text-pink-300 hover:text-white p-1 rounded-full bg-royalRose-900 border border-royalRose-700/40"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>

                <div className="flex items-center gap-3 mb-4 pb-3 border-b border-royalRose-800/40">
                  <img 
                    src={orderModalProduct.image} 
                    alt={orderModalProduct.title} 
                    className="w-16 h-20 rounded-xl object-cover object-top border border-royalRose-700/50"
                  />
                  <div>
                    <span className="text-[10px] text-champagne-400 font-mono font-bold uppercase">{orderModalProduct.code}</span>
                    <h3 className="text-sm sm:text-base font-bold text-white line-clamp-1">{orderModalProduct.title}</h3>
                    <p className="text-sm font-extrabold text-champagne-300">
                      ৳{orderModalProduct.price.toLocaleString('en-IN')}
                    </p>
                    <p className="text-[11px] text-pink-300/80">{orderModalProduct.fabric}</p>
                  </div>
                </div>

                <form onSubmit={handleWhatsAppSubmit} className="space-y-4 text-xs sm:text-sm">
                  
                  {/* Size Selection */}
                  <div>
                    <label className="block text-xs font-semibold text-champagne-200 mb-1.5">সাইজ নির্বাচন করুন:</label>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        'Semi-Stitched (কাস্টম ফিটিং)',
                        'Size 38 (Medium)',
                        'Size 40 (Large)',
                        'Size 42 (XL)'
                      ].map(sz => (
                        <button
                          type="button"
                          key={sz}
                          onClick={() => setSelectedSize(sz)}
                          className={`p-2 rounded-xl text-xs text-left border transition ${
                            selectedSize === sz
                              ? 'bg-royalRose-800 border-champagne-400 text-white font-bold'
                              : 'bg-royalRose-900/60 border-royalRose-700/40 text-pink-200 hover:border-royalRose-600'
                          }`}
                        >
                          {sz}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Quantity selector */}
                  <div className="flex items-center justify-between bg-royalRose-900/60 p-2.5 rounded-xl border border-royalRose-800/40">
                    <span className="font-semibold text-champagne-200">পিসের সংখ্যা:</span>
                    <div className="flex items-center gap-3">
                      <button 
                        type="button"
                        onClick={() => setQuantity(Math.max(1, quantity - 1))}
                        className="w-7 h-7 rounded bg-royalRose-800 text-champagne-300 font-bold border border-royalRose-700/40 flex items-center justify-center hover:bg-royalRose-700"
                      >-</button>
                      <span className="font-bold text-base text-white">{quantity}</span>
                      <button 
                        type="button"
                        onClick={() => setQuantity(quantity + 1)}
                        className="w-7 h-7 rounded bg-royalRose-800 text-champagne-300 font-bold border border-royalRose-700/40 flex items-center justify-center hover:bg-royalRose-700"
                      >+</button>
                    </div>
                  </div>

                  {/* Customer Information */}
                  <div className="space-y-2.5">
                    <div>
                      <label className="block text-xs text-pink-200 mb-1 font-medium">আপনার নাম *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="যেমন: তানিয়া ইসলাম"
                        value={customerName}
                        onChange={(e) => setCustomerName(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-royalRose-900/80 border border-royalRose-700/50 text-white placeholder-pink-300/40 focus:outline-none focus:border-champagne-400 text-xs"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-pink-200 mb-1 font-medium">মোবাইল নম্বর *</label>
                      <input 
                        type="tel" 
                        required 
                        placeholder="যেমন: 017XXXXXXXX"
                        value={customerPhone}
                        onChange={(e) => setCustomerPhone(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-royalRose-900/80 border border-royalRose-700/50 text-white placeholder-pink-300/40 focus:outline-none focus:border-champagne-400 text-xs"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-pink-200 mb-1 font-medium">ডেলিভারি ঠিকানা</label>
                      <textarea 
                        rows="2" 
                        placeholder="বাসা নং, রোড, এরিয়া, জেলা..."
                        value={customerAddress}
                        onChange={(e) => setCustomerAddress(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-royalRose-900/80 border border-royalRose-700/50 text-white placeholder-pink-300/40 focus:outline-none focus:border-champagne-400 text-xs"
                      ></textarea>
                    </div>
                  </div>

                  {/* Delivery Mode Radios */}
                  <div className="space-y-1.5 pt-1">
                    <label className="block text-xs font-semibold text-champagne-200">ডেলিভারি এলাকা ও চার্জ:</label>
                    
                    <label className="flex items-center justify-between p-2 rounded-xl bg-royalRose-900/50 border border-royalRose-800/50 cursor-pointer hover:border-royalRose-600">
                      <div className="flex items-center gap-2">
                        <input 
                          type="radio" 
                          name="delivery" 
                          value="dhaka" 
                          checked={deliveryOption === 'dhaka'}
                          onChange={() => setDeliveryOption('dhaka')}
                          className="accent-champagne-500"
                        />
                        <span className="text-xs text-pink-100">ঢাকা সিটির ভেতরে হোম ডেলিভারি</span>
                      </div>
                      <span className="text-xs font-bold text-champagne-300">৳৮০</span>
                    </label>

                    <label className="flex items-center justify-between p-2 rounded-xl bg-royalRose-900/50 border border-royalRose-800/50 cursor-pointer hover:border-royalRose-600">
                      <div className="flex items-center gap-2">
                        <input 
                          type="radio" 
                          name="delivery" 
                          value="outside" 
                          checked={deliveryOption === 'outside'}
                          onChange={() => setDeliveryOption('outside')}
                          className="accent-champagne-500"
                        />
                        <span className="text-xs text-pink-100">ঢাকা সিটির বাইরে কুরিয়ার</span>
                      </div>
                      <span className="text-xs font-bold text-champagne-300">৳১৫০</span>
                    </label>

                    <label className="flex items-center justify-between p-2 rounded-xl bg-royalRose-900/50 border border-royalRose-800/50 cursor-pointer hover:border-royalRose-600">
                      <div className="flex items-center gap-2">
                        <input 
                          type="radio" 
                          name="delivery" 
                          value="pickup" 
                          checked={deliveryOption === 'pickup'}
                          onChange={() => setDeliveryOption('pickup')}
                          className="accent-champagne-500"
                        />
                        <span className="text-xs text-pink-100">বনানী ফ্ল্যাগশিপ শোরুম পিকআপ</span>
                      </div>
                      <span className="text-xs font-bold text-emerald-400">ফ্রি</span>
                    </label>
                  </div>

                  {/* Bill Summary */}
                  <div className="pt-2 border-t border-royalRose-800/40 flex items-center justify-between text-xs sm:text-sm">
                    <span className="font-semibold text-pink-200">সর্বমোট প্রদেয় বিল:</span>
                    <span className="text-lg sm:text-xl font-extrabold text-champagne-300">
                      ৳{grandTotal.toLocaleString('en-IN')}
                    </span>
                  </div>

                  {/* Submit Button */}
                  <button 
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-sm sm:text-base shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 active:scale-98"
                  >
                    <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
                      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                    </svg>
                    <span>হোয়াটসঅ্যাপে সরাসরি অর্ডার পাঠান</span>
                  </button>

                  <p className="text-[10px] text-center text-pink-300/60">
                    * সাবমিট করলেই স্বয়ংক্রিয়ভাবে NIBIR Fashion অফিসিয়াল হোয়াটসঅ্যাপ নম্বরে অর্ডার মেসেজ প্রস্তুত হবে।
                  </p>

                </form>

              </div>
            </div>
          )}

          {/* 8. IMAGE LIGHTBOX MODAL */}
          {zoomImage && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/95 backdrop-blur-md animate-fade-in"
              onClick={() => setZoomImage(null)}
            >
              <button 
                onClick={() => setZoomImage(null)}
                className="absolute top-5 right-5 text-white/80 hover:text-white p-2 rounded-full bg-royalRose-900/80 border border-champagne-400/40"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
              <img 
                src={zoomImage} 
                alt="Enlarged Dress View" 
                className="max-w-full max-h-[90vh] rounded-2xl object-contain shadow-2xl border border-champagne-500/40"
                onClick={(e) => e.stopPropagation()}
              />
            </div>
          )}

          {/* 9. BOTTOM MOBILE STICKY BAR */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-royalRose-950/95 backdrop-blur-md border-t border-royalRose-800/60 p-3 flex items-center gap-2">
            <a 
              href={`tel:${BRAND_PHONE}`}
              className="flex-1 py-2.5 rounded-xl bg-royalRose-900 border border-royalRose-700/60 text-champagne-300 text-xs font-bold flex items-center justify-center gap-1.5"
            >
              <svg className="w-4 h-4 text-champagne-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <span>কল করুন</span>
            </a>

            <a 
              href="#collection" 
              className="flex-[2] py-2.5 rounded-xl bg-gradient-to-r from-royalRose-600 via-royalRose-500 to-royalRose-600 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-md"
            >
              <span>কালেকশন ও অর্ডার</span>
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
              </svg>
            </a>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
